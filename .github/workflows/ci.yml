name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        os: [ubuntu-latest]
        include:
          - php: '8.3'
            os: ubuntu-latest
            primary: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DBUSER: tests
      DBPASS: tests
      DBHOST: localhost
      DBNAME: tests
      PGDBUSER: postgres
      PGDBPASS: postgres
      PGDBHOST: localhost
      PGDBNAME: tests
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pgsql, pdo, pdo_mysql, pdo_pgsql
          coverage: ${{ matrix.primary && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Load MySQL fixtures
        run: mysql --host=127.0.0.1 --user=root --password=root --default-character-set=utf8mb4 < tests/mysql.sql

      - name: Load PostgreSQL fixtures
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -c 'DROP DATABASE IF EXISTS tests;' -c 'DROP DATABASE IF EXISTS tests2;' -c 'CREATE DATABASE tests;'
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d tests -f tests/psql.sql

      - name: Run test suite
        if: ${{ ! matrix.primary }}
        run: vendor/bin/phpunit --testsuite "all tests" --no-coverage --display-deprecations

      - name: Run test suite with coverage
        if: ${{ matrix.primary }}
        run: vendor/bin/phpunit --testsuite "all tests" --display-deprecations

      - name: Upload coverage to Codecov
        if: ${{ matrix.primary }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Upload coverage artifact
        if: ${{ matrix.primary }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.php }}
          path: coverage.xml
